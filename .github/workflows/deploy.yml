name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/synmal/url_shortener
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          target: production
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy
        env:
          SSH_OPTIONS: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          URL_SHORTENER_DATABASE_PASSWORD: ${{ secrets.URL_SHORTENER_DATABASE_PASSWORD }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          APP_HOST: ${{ secrets.APP_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SIDEKIQ_WEB_USERNAME: ${{ secrets.SIDEKIQ_WEB_USERNAME }}
          SIDEKIQ_WEB_PASSWORD: ${{ secrets.SIDEKIQ_WEB_PASSWORD }}
        run: |
          printf 'GITHUB_TOKEN=%s\n' "$GITHUB_TOKEN" > .kamal/secrets
          printf 'RAILS_MASTER_KEY=%s\n' "$RAILS_MASTER_KEY" >> .kamal/secrets
          printf 'URL_SHORTENER_DATABASE_PASSWORD=%s\n' "$URL_SHORTENER_DATABASE_PASSWORD" >> .kamal/secrets
          printf 'POSTGRES_PASSWORD=%s\n' "$URL_SHORTENER_DATABASE_PASSWORD" >> .kamal/secrets
          printf 'SIDEKIQ_WEB_USERNAME=%s\n' "$SIDEKIQ_WEB_USERNAME" >> .kamal/secrets
          printf 'SIDEKIQ_WEB_PASSWORD=%s\n' "$SIDEKIQ_WEB_PASSWORD" >> .kamal/secrets
          bundle exec kamal setup -v
