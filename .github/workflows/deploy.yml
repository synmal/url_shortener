name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/synmal/url_shortener
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: production
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          SSH_KEY_FILE: ~/.ssh/deploy_key
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          URL_SHORTENER_DATABASE_PASSWORD: ${{ secrets.URL_SHORTENER_DATABASE_PASSWORD }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          APP_HOST: ${{ secrets.APP_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          printf 'GITHUB_TOKEN=%s\n' "$GITHUB_TOKEN" > .kamal/secrets
          printf 'RAILS_MASTER_KEY=%s\n' "$RAILS_MASTER_KEY" >> .kamal/secrets
          printf 'URL_SHORTENER_DATABASE_PASSWORD=%s\n' "$URL_SHORTENER_DATABASE_PASSWORD" >> .kamal/secrets
          printf 'POSTGRES_PASSWORD=%s\n' "$URL_SHORTENER_DATABASE_PASSWORD" >> .kamal/secrets
          printf 'SERVER_HOST=%s\n' "$SERVER_HOST" >> .kamal/secrets
          printf 'APP_HOST=%s\n' "$APP_HOST" >> .kamal/secrets
          printf 'SSH_USER=%s\n' "$SSH_USER" >> .kamal/secrets
          bundle exec kamal deploy -v
