service: url_shortener

image: ghcr.io/synmal/url_shortener

servers:
  web:
    hosts:
      - <%= ENV["SERVER_HOST"] %>
    cmd: ./bin/thrust ./bin/rails server
  workers:
    hosts:
      - <%= ENV["SERVER_HOST"] %>
    cmd: bundle exec sidekiq

proxy:
  host: <%= ENV["APP_HOST"] %>
  ssl: true
  app_port: 80
  healthcheck:
    path: /up

registry:
  server: ghcr.io
  username:
    - GITHUB_TOKEN
  password:
    - GITHUB_TOKEN

builder:
  dockerfile: Dockerfile
  target: production
  arch: amd64
  cache:
    type: gha

env:
  clear:
    APP_HOST: $APP_HOST
    DATABASE_URL: <%= "postgres://url_shortener:#{ENV['URL_SHORTENER_DATABASE_PASSWORD']}@url_shortener-db:5432/url_shortener_production" %>
    REDIS_URL: redis://url_shortener-redis:6379/0
    RAILS_LOG_LEVEL: info
  secret:
    - RAILS_MASTER_KEY
    - URL_SHORTENER_DATABASE_PASSWORD

ssh:
  user: <%= ENV["SSH_USER"] %>

asset_path: /rails/public/assets

accessories:
  db:
    image: postgres:17
    host: <%= ENV["SERVER_HOST"] %>
    port: "5432:5432"
    env:
      clear:
        POSTGRES_USER: url_shortener
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
    options:
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U url_shortener"]
        interval: 10s
        timeout: 5s
        retries: 3

  redis:
    image: redis:7-alpine
    host: <%= ENV["SERVER_HOST"] %>
    port: "6379:6379"
    directories:
      - data:/data
    options:
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 10s
        timeout: 5s
        retries: 5
